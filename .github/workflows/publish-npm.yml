name: Publish to npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: archives/
          merge-multiple: true
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish through trusted publishing
        run: |
          version=$(jq --raw-output '.releases[0].app_version' <<< "$PLAN")
          prerelease=$(jq --raw-output '.announcement_is_prerelease' <<< "$PLAN")
          tag=latest
          if [ "$prerelease" = true ]; then tag=next; fi
          npm/publish.sh archives "$version" "$tag"
