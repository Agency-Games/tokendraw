name: Publish to npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Fetch the npm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish through trusted publishing
        run: |
          prerelease=$(jq --raw-output '.announcement_is_prerelease' <<< "$PLAN")
          tag=latest
          if [ "$prerelease" = true ]; then tag=next; fi
          for pkg in $(jq --raw-output '.releases[].artifacts[] | select(endswith("-npm-package.tar.gz"))' <<< "$PLAN"); do
            npm publish --access public --provenance --tag "$tag" "./npm/$pkg"
          done
