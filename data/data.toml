# The data version and the sources the shipped data cites.
#
# Every value in the shipped data names its sources by the ids below, a
# quality label and a review date. Labels: M provider-disclosed for this
# model, C company-published and not verified, I independent research, D
# tool default with a range, S spend-based.

# The date of the last change to any shipped data file.
id = "2026-10-09"

# Values last reviewed longer ago than this are flagged as stale.
review_interval_days = 90

# The same for list prices, which labs change within weeks.
price_review_interval_days = 30

