[[finding]]
id = "model-choice"
roles = ["subagent", "headless"]
label = "D"
sources = ["claude-code-sub-agents", "claude-code-cli-reference", "claude-agent-sdk-python", "codex-models", "codex-config-reference"]
basis = "Tool default for the roles counted: in Claude Code and Codex one setting chooses the model of subagents, and one flag or option the model of a headless run."
reviewed = 2026-10-15

[[action]]
finding = "model-choice"
client = "claude-code"
model = "claude-haiku-5-5"
steps = ["model: haiku in a subagent's definition", "CLAUDE_CODE_SUBAGENT_MODEL=haiku", "claude -p --model haiku", "model=\"haiku\" in the Agent SDK's options"]
label = "C"
sources = ["claude-code-sub-agents", "claude-code-env-vars", "claude-code-cli-reference", "claude-agent-sdk-python", "claude-agent-sdk-typescript", "claude-code-model-config", "anthropic-pricing"]
basis = "A subagent's model field takes sonnet, opus, haiku, fable or a full model ID; CLAUDE_CODE_SUBAGENT_MODEL is the default model for subagents that are not assigned one another way; --model sets the model for the current session; the Python and TypeScript Agent SDKs' model option takes a Claude model alias or full model name. The haiku alias uses the fast and efficient Haiku model, Claude Haiku 5.5 (claude-haiku-5-5) on the Anthropic API, the lowest-priced of the four in prices.toml."
reviewed = 2026-10-15

[[action]]
finding = "model-choice"
client = "codex"
model = "gpt-6-luna"
steps = ["agents.default_subagent_model = \"gpt-6-luna\" in config.toml", "codex exec --model gpt-6-luna"]
label = "C"
sources = ["codex-config-reference", "codex-models", "openai-pricing"]
basis = "agents.default_subagent_model is the default model for spawned agents; --model also works with non-interactive runs. Of the models Codex's models page recommends (gpt-6-astra, gpt-6.1-sol, gpt-6-luna), gpt-6-luna, described as the most efficient model for focused, high-volume tasks, has the lowest list price in prices.toml."
reviewed = 2026-10-15
