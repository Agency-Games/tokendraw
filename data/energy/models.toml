# Models by name as the logs record it. A pattern is an exact name or a
# prefix ending in `*`; the longest matching pattern wins. A model that
# matches none uses the frontier set and is reported as unmatched.
#
# `weights` is open, closed or unknown, recorded per model, not per
# provider. A model that names a `price` gets b_in and b_out from it
# (prices.toml); the other parameters come from its parameter set.

[[model]]
id = "claude"
pattern = "claude-*"
parameter_set = "frontier"
weights = "closed"
label = "C"
sources = ["anthropic-models"]
basis = "Anthropic serves its Claude models through its API and cloud platforms and publishes no weights."
reviewed = 2026-10-06

[[model]]
id = "gpt"
pattern = "gpt-*"
parameter_set = "frontier"
weights = "closed"
label = "C"
sources = ["openai-models"]
basis = "OpenAI serves its GPT models through its API; it publishes weights only for gpt-oss."
reviewed = 2026-10-06

[[model]]
id = "gpt-oss"
pattern = "gpt-oss*"
parameter_set = "frontier"
weights = "open"
label = "C"
