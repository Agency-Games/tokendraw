description = "MiMo V2.6 Flash (XiaomiMiMo/MiMo-V2.6-Flash-RL) from its published configuration: 9 global layers (64 query heads, 4 key-value heads, key width 192, value width 128) and 39 sliding layers (window 128, 64 query heads, 8 key-value heads, same widths). KV format not documented: BF16."
reviewed = 2026-10-08

[parameter_set.a_p_uj_per_pair]
lower_bound = 0.18432
low_case = 0.18432
base_case = 0.38707199999999997
high_case = 0.589824
upper_bound = 0.589824
label = "D"
sources = ["config-mimo-v2-6-flash", "mlenergy-v3", "flashmla"]
basis = "Prefill attention whose cost grows with every earlier token: full attention, compressed attention without a top-k cap (over its ratio) and lightning indexers, FLOPs per pair of a new token and an earlier token times energy per FLOP. Capped attention is in b_in. Bounds, low case and high case: the low and the high scenario; base case: the base scenario. Scenarios: low GB200-class, FP8 attention (0.5 pJ per FLOP, 150 pJ per byte), base B200, 16-bit attention (1.05 pJ, 225 pJ), high H100 or H800 (1.6 pJ, 360 pJ). Whole-node power divided by achieved throughput. Per FLOP: an H100 or H800 node draws about 7.5 to 8 kW over 8 x about 600 TFLOPS achieved, about 1.6 pJ; a B200 node about 11 to 12 kW over 8 x about 1,350 TFLOPS (FlashMLA sparse prefill on B200), about 1.05 pJ; FP8 attention on Blackwell about 0.5 pJ. Per byte: node power over 80 percent of peak memory bandwidth, H100 3.35 TB/s at about 7.75 kW per 8 GPUs (360 pJ), B200 8 TB/s at about 11.5 kW (225 pJ), GB200-class 150 pJ; about 30 uJ per pair of an output token and a context token for Qwen3-32B on B200 in the ML.ENERGY Leaderboard v3.0 is consistent with them. Reload: host memory read and PCIe transfer, 0.1 to 0.3 nJ per byte."

[parameter_set.a_d_uj_per_pair]
lower_bound = 3.456
low_case = 3.456
base_case = 5.184
high_case = 8.2944
upper_bound = 8.2944
label = "D"
sources = ["config-mimo-v2-6-flash", "mlenergy-v3", "flashmla"]
basis = "Decode attention whose cost grows with every earlier token, as for a_p: per pair of an output token and an earlier token, the larger of the key-value bytes read times energy per byte and the FLOPs times energy per FLOP. Capped attention is in b_out. Bounds, low case and high case: the low and the high scenario; base case: the base scenario."

[parameter_set.b_in_j_per_token]
lower_bound = 0.04672385778162162
low_case = 0.04672385778162162
base_case = 0.060822804044108114
high_case = 0.09357039895524324
upper_bound = 0.09357039895524324
label = "D"
sources = ["config-mimo-v2-6-flash", "mlenergy-v3", "flashmla", "card-mimo-v2-6-flash", "deepseek-fleet"]
basis = "Weights: 0.23 J per new token at 37 billion active parameters on H800 (DeepSeek's fleet), scaled to 15 billion active in prefill and by the hardware factor 0.5 / 0.65 / 1, 0.0606 J base case. Attention capped at a window, a top-k selection or a fixed state, at its cap, 0.0002 J base case. Bounds, low case and high case: the low and the high scenario; base case: the base scenario."

[parameter_set.b_out_j_per_token]
lower_bound = 0.08086088302702703
low_case = 0.08086088302702703
base_case = 0.10588591913513513
high_case = 0.16325530845405406
upper_bound = 0.16325530845405406
label = "D"
sources = ["config-mimo-v2-6-flash", "mlenergy-v3", "flashmla", "card-mimo-v2-6-flash", "deepseek-fleet"]
basis = "Weights: 0.38 J per output token at 37 billion active parameters on H800, scaled to 15 billion active and by the hardware factor 0.5 / 0.65 / 1, 0.1001 J base case. Attention capped at a window, a top-k selection or a fixed state, at its cap, 0.0058 J base case. Bounds, low case and high case: the low and the high scenario; base case: the base scenario."

[parameter_set.c0_mj_per_cached_token]
lower_bound = 0.022272000000000004
low_case = 0.022272000000000004
base_case = 0.04454400000000001
high_case = 0.066816
upper_bound = 0.066816
label = "D"
sources = ["config-mimo-v2-6-flash", "mlenergy-v3", "flashmla"]
basis = "Reloading the 222720 bytes of key-value entries a cached token holds over all layers (compressed entries over their ratio) from host memory once per call at 0.1 / 0.2 / 0.3 nJ per byte. Bounds, low case and high case: the low and the high scenario; base case: the base scenario."

[parameter_set.idle]
lower_bound = 1.0
low_case = 1.0
base_case = 1.12
high_case = 1.35
upper_bound = 1.9
label = "D"
sources = ["deepseek-fleet", "google-gemini-energy", "dynamollm", "inverse-w-law"]
basis = "Serving energy including reserved and idle capacity, divided by the energy of the same work at load; the provider's PUE is applied separately. Low: a fleet scaled to its load, as DeepSeek's, which releases inference nodes to research and training at night. Base case: Google's Gemini measurement, idle machines 10 percent against 83 percent for active machines, (83 + 10) / 83 = 1.12. High: capacity provisioned for peak load, idle servers drawing half their power at load (H100, 300 W against 600 W), at a peak of 1.7 times the average load (Azure conversation traffic, high case, 1 + 0.7 x 0.5) and 2.8 times (Azure coding traffic, upper bound, 1 + 1.8 x 0.5)."

