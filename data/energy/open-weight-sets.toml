[[parameter_set]]
id = "deepseek-v4-pro"
description = "DeepSeek V4 Pro (deepseek-ai/DeepSeek-V4-Pro) from its published configuration: 61 layers: 30 Compressed Sparse Attention layers (compression ratio 4, lightning indexer top-k 1,024) and 31 Heavily Compressed Attention layers (ratio 128, dense over the compressed entries), each with a 128-token sliding branch; 128 query heads over one shared 512-wide key-value vector, stored in FP8 with BF16 rotary dimensions (448 + 64 x 2 = 576 bytes per entry); FP4 indexer, 64 heads x 128. The multi-token prediction layer and hyper-connections are not counted."
reviewed = 2026-10-08

[parameter_set.a_p_uj_per_pair]
lower_bound = 0.04710399999999999
low_case = 0.04710399999999999
base_case = 0.0989184
high_case = 0.15073280000000003
upper_bound = 0.15073280000000003
label = "D"
sources = ["config-deepseek-v4-pro", "card-deepseek-v4-pro", "mlenergy-v3", "flashmla"]
basis = "Prefill attention whose cost grows with every earlier token: full attention, compressed attention without a top-k cap (over its ratio) and lightning indexers, FLOPs per pair of a new token and an earlier token times energy per FLOP. Capped attention is in b_in. Bounds, low case and high case: the low and the high scenario; base case: the base scenario. Scenarios: low GB200-class, FP8 attention (0.5 pJ per FLOP, 150 pJ per byte), base B200, 16-bit attention (1.05 pJ, 225 pJ), high H100 or H800 (1.6 pJ, 360 pJ). Whole-node power divided by achieved throughput. Per FLOP: an H100 or H800 node draws about 7.5 to 8 kW over 8 x about 600 TFLOPS achieved, about 1.6 pJ; a B200 node about 11 to 12 kW over 8 x about 1,350 TFLOPS (FlashMLA sparse prefill on B200), about 1.05 pJ; FP8 attention on Blackwell about 0.5 pJ. Per byte: node power over 80 percent of peak memory bandwidth, H100 3.35 TB/s at about 7.75 kW per 8 GPUs (360 pJ), B200 8 TB/s at about 11.5 kW (225 pJ), GB200-class 150 pJ; about 30 uJ per pair of an output token and a context token for Qwen3-32B on B200 in the ML.ENERGY Leaderboard v3.0 is consistent with them. Reload: host memory read and PCIe transfer, 0.1 to 0.3 nJ per byte."

