description = "DeepSeek V4.1 Flash (deepseek-ai/DeepSeek-V4.1-Flash) from its published configuration: 40 layers: layers 0 and 1 sliding only (window 128); 18 encoder layers with compression ratio 2 and 20 decoder layers uncompressed, all with top-k 512 and the 128-token sliding branch; 64 query heads over one shared 512-wide key-value vector; global KV cache 890 bytes per token over the model, FP4 with E4M3 scales (taken as 890 / 38 = 23.4 bytes per entry per layer); indexer 32 heads x 128 at FP4 in the 8 index-source layers. Not modelled: the Reuse and Reindex modes, the encoder-decoder prefill shortcut and Engram memory, which overstates prefill attention."
