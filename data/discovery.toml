# Where clients without an adapter keep logs with per-call usage, so a
# report can say that their logs were found but not read.
#
# A path starts with ~ for the home directory, or with $NAME or %NAME% for
# an environment variable, and is skipped when that variable is unset,
# empty or relative. Components are separated by / on every OS. The first
# path for the OS that exists is shown.

[sources.opencode-paths]
title = "OpenCode database location (Global.Path.data and OPENCODE_DB)"
url = "https://github.com/anomalyco/opencode/blob/v1.18.35/packages/opencode/src/session/session.ts#L338-L378"
publisher = "OpenCode"
accessed = 2026-10-08

[[location]]
id = "opencode"
paths = [
  { os = ["linux", "macos", "windows"], path = "$OPENCODE_DB" },
  { os = ["linux", "macos", "windows"], path = "$XDG_DATA_HOME/opencode/opencode.db" },
  { os = ["linux", "macos", "windows"], path = "~/.local/share/opencode/opencode.db" },
  { os = ["windows"], path = "%APPDATA%/opencode/opencode.db" },
]
label = "C"
sources = ["opencode-paths"]
basis = "From the source; the v1.2.0 release note names %APPDATA% on Windows, unverified."
reviewed = 2026-10-08

