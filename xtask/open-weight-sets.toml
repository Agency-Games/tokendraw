# The inputs of `cargo xtask open-weight-sets`: the attention layout of
# each open-weight model in price-calibration.toml, read from its published
# configuration, and the energy of attention work on three serving
# scenarios. Active parameters, the weight energy anchor and the hardware
# weight factors come from price-calibration.toml. The command writes
# data/energy/open-weight-sets.toml. Source ids that this file does not
# define are defined in data/data.toml or price-calibration.toml.
#
# A model has groups of attention layers:
#
# - `kind`: how many earlier tokens a token attends to at position c:
#   "full" c; "sliding" min(c, window); "sparse" min(c, topk) plus
#   min(c, window) when `window` is set; "compressed" c / ratio, capped at
#   `topk` when set, plus min(c, window) when set; "linear" none (a fixed
#   state per sequence instead).
# - `layout`: "gqa" (query heads `heads`, key-value heads `kv_heads`, key
#   and value widths `qk_dim`, `v_dim`, `kv_bytes` per stored element);
#   "mla" (query heads `heads`, latent `kv_lora` and `rope`, prefill widths
#   `qk_dim` and `v_dim`, `kv_bytes` per stored element); "shared_kv"
#   (query heads `heads`, one key-value vector of `head_dim` serving as key
#   and value, `kv_entry_bytes` per stored entry); "linear" (a state of
#   `heads` x `qk_dim` x `v_dim` values of `state_bytes` bytes).
# - `index_*`: a lightning indexer that scores every earlier entry (after
#   compression) with `index_heads` x `index_dim` at `index_bits` bits, in
#   `index_layers` of the group's layers.
#
# `kv_bytes` is 2 (BF16) where a model's documentation does not state the
# format of its key-value cache.

# Node energy of attention work at load on each scenario of
# price-calibration.toml's hardware factors: energy per attention FLOP at
# 16-bit precision (8-bit counts half, 4-bit a quarter), per byte read from
# accelerator memory in memory-bound decode, and per byte of a cached
# token's key-value entries reloaded from host memory once per call.
[hardware]
sources = ["mlenergy-v3", "flashmla"]
basis = "Whole-node power divided by achieved throughput. Per FLOP: an H100 or H800 node draws about 7.5 to 8 kW over 8 x about 600 TFLOPS achieved, about 1.6 pJ; a B200 node about 11 to 12 kW over 8 x about 1,350 TFLOPS (FlashMLA sparse prefill on B200), about 1.05 pJ; FP8 attention on Blackwell about 0.5 pJ. Per byte: node power over 80 percent of peak memory bandwidth, H100 3.35 TB/s at about 7.75 kW per 8 GPUs (360 pJ), B200 8 TB/s at about 11.5 kW (225 pJ), GB200-class 150 pJ; about 30 uJ per pair of an output token and a context token for Qwen3-32B on B200 in the ML.ENERGY Leaderboard v3.0 is consistent with them. Reload: host memory read and PCIe transfer, 0.1 to 0.3 nJ per byte."

[hardware.low]
description = "GB200-class, FP8 attention"
e_flop_pj = 0.5
e_byte_pj = 150
reload_nj_per_byte = 0.1

[hardware.central]
description = "B200, 16-bit attention"
e_flop_pj = 1.05
e_byte_pj = 225
reload_nj_per_byte = 0.2

[hardware.high]
description = "H100 or H800"
e_flop_pj = 1.6
e_byte_pj = 360
reload_nj_per_byte = 0.3

[sources.flashmla]
title = "FlashMLA: efficient multi-head latent attention kernels (sparse prefill on B200 up to 1,350 TFLOPS)"
url = "https://github.com/deepseek-ai/FlashMLA"
publisher = "DeepSeek-AI"
accessed = 2026-10-06

[[model]]
id = "deepseek-v4-pro"
name = "DeepSeek V4 Pro"
hf_repo = "deepseek-ai/DeepSeek-V4-Pro"
sources = ["config-deepseek-v4-pro", "card-deepseek-v4-pro"]
basis = "61 layers: 30 Compressed Sparse Attention layers (compression ratio 4, lightning indexer top-k 1,024) and 31 Heavily Compressed Attention layers (ratio 128, dense over the compressed entries), each with a 128-token sliding branch; 128 query heads over one shared 512-wide key-value vector, stored in FP8 with BF16 rotary dimensions (448 + 64 x 2 = 576 bytes per entry); FP4 indexer, 64 heads x 128. The multi-token prediction layer and hyper-connections are not counted."

[[model.group]]
kind = "compressed"
layers = 30
layout = "shared_kv"
heads = 128
head_dim = 512
kv_entry_bytes = 576
ratio = 4
topk = 1024
window = 128
index_heads = 64
index_dim = 128
index_bits = 4
index_layers = 30

[[model.group]]
