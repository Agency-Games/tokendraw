# The inputs of `cargo xtask price-calibration` besides OpenRouter's
# endpoint files: the open-weight models whose host prices calibrate list
# prices, their active parameters, the weight energy anchor, the hardware
# factors and the markup band. The command writes
# data/energy/price-calibration.toml from them. Source ids that this file
# does not define are defined in data/data.toml.

id = "open-weight-hosts"
description = "Weight energy per USD that hosts of open-weight models sell, from their prices on OpenRouter"

# The reference call: new input and output tokens, no cache, below every
# long-context price tier.
chat_input_tokens = 1000
chat_output_tokens = 500

# DeepSeek's fleet: weight energy per cache-miss input token and per output
# token at 37 billion active parameters on H800, scaled linearly by active
# parameters, as the frontier set's b_in and b_out are.
[anchor]
active_b = 37
in_j = 0.23
out_j = 0.38
sources = ["deepseek-fleet"]

# Weight energy relative to DeepSeek's H800 fleet for three serving
# scenarios.
[hardware]
low = 0.5
base = 0.65
high = 1.0
sources = ["mlenergy-v3"]
basis = "High: H100 or H800, as DeepSeek's fleet. Base: B200, 35 percent less energy per token in the ML.ENERGY Leaderboard v3.0. Low: GB200-class with FP4 experts, an assumption below B200."

[markup]
lower_bound = 1
low_case = 1
base_case = 1.825
high_case = 3.33
upper_bound = 3.33
label = "D"
sources = ["margin-anthropic", "margin-openai"]
basis = "How far a closed lab's list price sits above the price hosts of open-weight models charge for the same serving cost. Neither the labs nor the hosts publish it. Low: lab and hosts at the same margin. High: a lab at OpenAI's reported compute margin of 70 percent, 1 / (1 - 0.70) = 3.33 times compute cost, with hosts at cost; Anthropic's reported 40 percent gross margin gives at least 1.67. Both are leaked figures that neither company confirmed. Base case: the geometric mean of 1 and 3.33."

[sources.margin-anthropic]
title = "Anthropic projected a 40 percent gross margin for 2025 on products sold to enterprises and developers (relaying The Information)"
url = "https://www.itiger.com/news/1154519858"
publisher = "Deep News"
published = "2026-01-22"
accessed = 2026-10-07

[sources.margin-openai]
title = "OpenAI's compute margin reached 70 percent in October 2025 (relaying The Information)"
url = "https://fortune.com/2025/12/21/openai-compute-margins-revenue-chatgpt-earnings-sam-altman/"
publisher = "Fortune"
published = "2025-12-21"
accessed = 2026-10-07

# Each model: its OpenRouter slugs and active parameters in billions, in
# prefill and decode where the model card gives both.

[[model]]
id = "deepseek-v4-pro"
openrouter_slugs = ["deepseek/deepseek-v4-pro", "deepseek/deepseek-v4-pro-0813"]
active_b = 49
sources = ["card-deepseek-v4-pro"]
basis = "Model card: 1.6T parameters, 49B activated. The 0813 release has the same configuration."

[[model]]
id = "deepseek-v4.1-flash"
openrouter_slugs = ["deepseek/deepseek-v4.1-flash"]
